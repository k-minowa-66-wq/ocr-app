<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手書き英作文 文字起こしツール</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: "BIZ UDPGothic", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 18px;
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 16px;
    }
    .btn-select {
      display: block;
      width: 100%;
      padding: 14px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-select:hover { background: #dbeafe; }
    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 14px;
      font-family: monospace;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .btn-send {
      display: block;
      width: 100%;
      padding: 14px;
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn-send:hover { background: #047857; }
    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
      font-weight: bold;
      color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📷 手書き英作文 文字起こし</h1>
  <p style="font-size: 12px; color: #64748b; margin-bottom: 16px; text-align: center;">
    手書き英文の写真を撮影または選択してください。
  </p>

  <label for="imageInput" class="btn-select" id="lblSelect">
    📂 写真を撮影・選択する
  </label>
  <input type="file" id="imageInput" accept="image/*" style="display:none;">

  <div id="loading" class="loading">⚡ AIが手書き文字を解析中... (数秒かかります)</div>

  <label style="font-size:12px; font-weight:bold;">文字起こし結果（必要に応じて修正可能）：</label>
  <textarea id="resultText" placeholder="ここに文字起こし結果が表示されます..."></textarea>

  <button type="button" id="btnSend" class="btn-send">✅ 添削アプリに送って閉じる</button>
</div>

<script>
  // 【共通】添削アプリと同じGASデプロイURLを貼り付けてください
  const GAS_URL = "https://script.google.com/macros/s/YOUR_GAS_URL_HERE/exec";

  document.getElementById('imageInput').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const loading = document.getElementById('loading');
    const inputEl = document.getElementById('imageInput');
    loading.style.display = 'block';
    inputEl.disabled = true;

    try {
      // 画像圧縮を強化 (最大1024px、画質0.70で消費トークンを半減)
      const base64Image = await compressImageFile(file, 1024, 0.70);
      const ocrPrompt = "Perform OCR on this handwritten English essay image for high school students. Extract ONLY the English text written in the image. Do NOT include any greetings, labels, or notes. Transcribe the text exactly as written.";

      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: "callGeminiAPI",
          prompt: ocrPrompt,
          base64ImageData: base64Image,
          maxTokens: 1500
        })
      });

      const data = await res.json();
      if (data.success && data.response) {
        document.getElementById('resultText').value = data.response.trim();
      } else {
        alert(data.error || "読み取れませんでした。もう一度撮影してください。");
      }
    } catch (err) {
      alert("エラーが発生しました: " + err.toString());
    } finally {
      loading.style.display = 'none';
      inputEl.disabled = false;
      inputEl.value = ""; // 選択リセット
    }
  });

  document.getElementById('btnSend').addEventListener('click', () => {
    const text = document.getElementById('resultText').value;
    if (!text || text.trim() === "") {
      return alert("文字起こし結果が空です。");
    }

    if (window.opener) {
      window.opener.postMessage({ action: 'sendEssayText', text: text }, '*');
      window.close();
    } else {
      navigator.clipboard.writeText(text);
      alert("クリップボードにコピーしました！添削アプリの初版入力欄に貼り付けてください。");
    }
  });

  function compressImageFile(file, maxSideLength, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxSideLength || height > maxSideLength) {
            if (width > height) {
              height = Math.round((height * maxSideLength) / width);
              width = maxSideLength;
            } else {
              width = Math.round((width * maxSideLength) / height);
              height = maxSideLength;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
