<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手書き英作文 文字起こしツール (端末内高速処理版)</title>
  <link rel="icon" href="data:,">
  <!-- Tesseract.js CDN (ブラウザ内・完全無料OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: "BIZ UDPGothic", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 18px;
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 16px;
    }
    .btn-select {
      display: block;
      width: 100%;
      padding: 14px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-select:hover { background: #dbeafe; }
    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 14px;
      font-family: monospace;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .btn-send {
      display: block;
      width: 100%;
      padding: 14px;
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn-send:hover { background: #047857; }
    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
      font-weight: bold;
      color: #1d4ed8;
    }
    .progress-bar {
      width: 100%;
      background-color: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
      height: 10px;
    }
    .progress-fill {
      height: 100%;
      background-color: #1d4ed8;
      width: 0%;
      transition: width 0.2s;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📷 手書き英作文 文字起こし</h1>
  <p style="font-size: 12px; color: #64748b; margin-bottom: 16px; text-align: center;">
    手書き英文の写真を撮影または選択してください。<br>（※お使いの端末内で完全無料で文字起こしします）
  </p>

  <label for="imageInput" class="btn-select" id="lblSelect">
    📂 写真を撮影・選択する
  </label>
  <input type="file" id="imageInput" accept="image/*" style="display:none;">

  <div id="loading" class="loading">
    <div id="statusText">🔍 端末内で文字起こし中...</div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <label style="font-size:12px; font-weight:bold;">文字起こし結果（必要に応じて修正可能）：</label>
  <textarea id="resultText" placeholder="ここに文字起こし結果が表示されます..."></textarea>

  <button type="button" id="btnSend" class="btn-send">✅ 添削アプリに送って閉じる</button>
</div>

<script>
  document.getElementById('imageInput').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const loading = document.getElementById('loading');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const inputEl = document.getElementById('imageInput');

    loading.style.display = 'block';
    inputEl.disabled = true;
    progressFill.style.width = '0%';

    try {
      const result = await Tesseract.recognize(file, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            const pct = Math.round(m.progress * 100);
            statusText.innerText = `🔍 端末内で文字起こし中... (${pct}%)`;
            progressFill.style.width = pct + '%';
          } else {
            statusText.innerText = `⚙️ 準備中: ${m.status}...`;
          }
        }
      });

      document.getElementById('resultText').value = result.data.text.trim();
    } catch (err) {
      alert("文字起こしエラー: " + err.toString());
    } finally {
      loading.style.display = 'none';
      inputEl.disabled = false;
      inputEl.value = "";
    }
  });

  document.getElementById('btnSend').addEventListener('click', () => {
    const text = document.getElementById('resultText').value;
    if (!text || text.trim() === "") {
      return alert("文字起こし結果が空です。");
    }

    if (window.opener) {
      window.opener.postMessage({ action: 'sendEssayText', text: text }, '*');
      window.close();
    } else {
      navigator.clipboard.writeText(text);
      alert("クリップボードにコピーしました！添削アプリの初版入力欄に貼り付けてください。");
    }
  });
</script>
</body>
</html>
